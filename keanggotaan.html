<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Keanggotaan - Koriko Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Quicksand', sans-serif; background-color: #F4F6F9; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #1A252F; color: white; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 25px 20px; font-weight: 700; font-size: 20px; color: #D63344; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-menu { list-style: none; padding: 15px 0; flex: 1; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 15px; padding: 15px 25px; color: #BDC3C7; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; border-left: 4px solid transparent; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: rgba(214,51,68,0.1); color: #D63344; border-left: 4px solid #D63344; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 30px; }
        
        .page-title { margin-bottom: 25px; color: #2C3E50; font-size: 24px; display: flex; align-items: center; gap: 10px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 25px; border: 1px solid #E5E7EB; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 13px; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #E5E7EB; border-radius: 10px; font-family: 'Quicksand', sans-serif; }
        .btn { background: #2C3E50; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; border: 1px solid #E5E7EB; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #E5E7EB; font-size: 14px; vertical-align: middle; }
        th { background: #F8F9FA; color: #555; font-weight: 700; font-size: 12px; }
        
        .aksi-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .btn-print-card { background: #E3F2FD; color: #1E88E5; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 12px; }
        .btn-edit { background: #FFF8E1; color: #F57C00; padding: 8px 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        .btn-hapus { background: #FFEBEE; color: #E53935; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 12px; }
        
        /* Desain Khusus Pending */
        .alert-pending { background: #FFF3E0; color: #FB8C00; padding: 20px; border-radius: 12px; margin-bottom: 25px; border-left: 5px solid #FB8C00; }
        .form-acc { display: flex; gap: 8px; align-items: center; }
        .input-nomor { padding: 8px 12px; border: 2px solid #FB8C00; border-radius: 8px; font-family: 'Quicksand', sans-serif; font-size: 13px; width: 120px; outline:none;}
        .btn-acc { background: #43A047; color: white; padding: 8px 15px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor:pointer; }
        .btn-tolak { background: #E53935; color: white; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 12px; }

        /* Modal Edit */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: white; width: 100%; max-width: 600px; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #E5E7EB; }
        .modal-header h3 { font-size: 18px; color: #2C3E50; }
        .modal-close { background: none; border: none; font-size: 20px; color: #888; cursor: pointer; }
        .akun-box { background: #F8F9FA; border: 1px dashed #CBD5E1; border-radius: 10px; padding: 15px; margin-top: 15px; }
        .akun-box-title { font-size: 13px; font-weight: 700; color: #D63344; margin-bottom: 12px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #E5E7EB; color: #374151; border: none; padding: 11px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        .btn-save { background: #D63344; color: white; border: none; padding: 11px 22px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: 'Quicksand', sans-serif; }
    </style>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand"><i class="fas fa-book-open"></i> KorikoAdmin</div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dasbor Admin</a></li>
            <li><a href="bibliografi.html"><i class="fas fa-book"></i> Data Buku</a></li>
            <li><a href="keanggotaan.html" class="active"><i class="fas fa-users"></i> Keanggotaan</a></li>
            <li><a href="sirkulasi.html"><i class="fas fa-exchange-alt"></i> Sirkulasi</a></li>
            <li><a href="tambah_admin.html"><i class="fas fa-user-plus"></i> Tambah Admin</a></li>
            <li><a href="opac.html" target="_blank"><i class="fas fa-search"></i> Buka OPAC Publik</a></li>
            <li><a href="logout.html" style="margin-top: 50px; color: #FF8A80;"><i class="fas fa-sign-out-alt"></i> Keluar Sistem</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h2 class="page-title"><i class="fas fa-users" style="color: #D63344;"></i> Manajemen Keanggotaan</h2>

        <div id="pendingBox"></div>

        <div class="card">
            <h3 style="margin-bottom: 15px; font-size: 16px;">Tambah Anggota Manual (Langsung Aktif)</h3>
            <form id="fTambah">
                <div class="form-grid">
                    <div class="form-group"><label>Nomor Anggota *</label><input type="text" name="nomor_anggota" required placeholder="AG-001"></div>
                    <div class="form-group"><label>Nama Lengkap *</label><input type="text" name="nama" required placeholder="Nama"></div>
                    <div class="form-group"><label>Jenis Kelamin *</label><select name="jenis_kelamin" required><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
                    <div class="form-group"><label>No. HP</label><input type="text" name="no_hp" placeholder="08xxx"></div>
                </div>
                <div class="form-group" style="margin-top: 15px;"><label>Alamat</label><textarea name="alamat" rows="2"></textarea></div>
                <button type="submit" class="btn"><i class="fas fa-user-plus"></i> Simpan (Auto Pass: 123456)</button>
            </form>
        </div>

        <table>
            <thead><tr><th>No. Anggota</th><th>Nama Lengkap</th><th>Akun Login</th><th>Aksi</th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>

    <div id="modalEdit" class="modal-overlay" onclick="tutupModalBackdrop(event)">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fas fa-user-edit" style="color: #D63344;"></i> Edit Data &amp; Akun Anggota</h3>
                <button type="button" class="modal-close" onclick="tutupModalEdit()">&times;</button>
            </div>
            <form id="fEdit">
                <input type="hidden" id="edit_id">
                <div class="form-grid">
                    <div class="form-group"><label>Nomor Anggota *</label><input type="text" id="edit_nomor" required></div>
                    <div class="form-group"><label>Nama Lengkap *</label><input type="text" id="edit_nama" required></div>
                    <div class="form-group"><label>Jenis Kelamin *</label>
                        <select id="edit_jk" required><option value="L">Laki-laki</option><option value="P">Perempuan</option></select>
                    </div>
                    <div class="form-group"><label>No. HP</label><input type="text" id="edit_hp"></div>
                </div>
                <div class="form-group" style="margin-top: 15px;"><label>Alamat</label><textarea id="edit_alamat" rows="2"></textarea></div>
                <div class="akun-box">
                    <div class="akun-box-title"><i class="fas fa-key"></i> Pengaturan Akun Login Pengguna</div>
                    <div class="form-grid">
                        <div class="form-group"><label>Username *</label><input type="text" id="edit_username" required></div>
                        <div class="form-group"><label>Password</label><input type="text" id="edit_password" placeholder="Kosongkan jika tidak diubah"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="tutupModalEdit()">Batal</button>
                    <button type="submit" class="btn-save"><i class="fas fa-save"></i> Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        K.requireRole('admin');
        function render() {
            var db = K.load();
            var pend = db.anggota.filter(function (a) { return a.status === 'Pending'; }).sort(function (a, b) { return a.id_anggota - b.id_anggota; });
            document.getElementById('pendingBox').innerHTML = !pend.length ? '' :
                '<div class="alert-pending"><h3 style="margin-bottom: 5px;"><i class="fas fa-bell"></i> Ada Pendaftar Baru!</h3><p>Silakan berikan <b>Nomor Anggota</b> yang sesuai (contoh: AG-001), lalu klik ACC.</p></div>' +
                '<div class="card" style="border: 2px solid #FB8C00;"><table><thead><tr><th>Nama Lengkap</th><th>Username</th><th>No. HP</th><th>Beri No. Anggota &amp; ACC</th></tr></thead><tbody>' +
                pend.map(function (p) {
                    return '<tr><td><strong>' + K.esc(p.nama) + '</strong></td><td>' + K.esc(p.username) + '</td><td>' + K.esc(p.no_hp) + '</td><td>' +
                        '<form class="form-acc" onsubmit="return accAnggota(event, ' + p.id_anggota + ')"><input type="text" class="input-nomor" placeholder="AG-001" required> ' +
                        '<button type="submit" class="btn-acc"><i class="fas fa-check"></i> ACC</button> ' +
                        '<a href="#" class="btn-tolak" onclick="hapusAnggota(' + p.id_anggota + ', \'Tolak dan hapus pendaftar ini?\'); return false;"><i class="fas fa-times"></i></a></form></td></tr>';
                }).join('') + '</tbody></table></div>';
            var aktif = db.anggota.filter(function (a) { return a.status === 'Aktif'; }).sort(function (a, b) { return b.id_anggota - a.id_anggota; });
            document.getElementById('rows').innerHTML = aktif.map(function (r) {
                return '<tr><td><strong>' + K.esc(r.nomor_anggota) + '</strong></td><td>' + K.esc(r.nama) + '</td>' +
                    '<td><span style="font-size:12px; color:#555;">User: <b>' + K.esc(r.username) + '</b> | Pass: <b>••••••</b></span></td>' +
                    '<td><div class="aksi-group"><button type="button" class="btn-edit" onclick="bukaModalEdit(' + r.id_anggota + ')"><i class="fas fa-edit"></i> Edit</button> ' +
                    '<a href="cetak_kartu.html?id=' + r.id_anggota + '" target="_blank" class="btn-print-card"><i class="fas fa-id-card"></i> Cetak Kartu</a> ' +
                    '<a href="#" class="btn-hapus" onclick="hapusAnggota(' + r.id_anggota + ', \'Hapus anggota ini?\'); return false;"><i class="fas fa-trash"></i></a></div></td></tr>';
            }).join('');
        }
        function accAnggota(e, id) {
            e.preventDefault();
            var nomor = e.target.querySelector('.input-nomor').value.trim();
            if (!confirm('Setujui akun ini?')) return false;
            if (K.one('anggota', function (a) { return a.nomor_anggota === nomor; })) { alert('Gagal! Nomor Anggota ' + nomor + ' sudah dipakai anggota lain.'); return false; }
            var a = K.byId('anggota', 'id_anggota', id);
            if (a) { a.status = 'Aktif'; a.nomor_anggota = nomor; K.save(); }
            render(); return false;
        }
        function hapusAnggota(id, msg) {
            if (!confirm(msg)) return;
            var db = K.load();
            db.anggota = db.anggota.filter(function (a) { return a.id_anggota !== id; });
            db.sirkulasi = db.sirkulasi.filter(function (s) { return s.id_anggota !== id; });
            K.save(); render();
        }
        document.getElementById('fTambah').addEventListener('submit', function (e) {
            e.preventDefault();
            var f = e.target, nomor = f.nomor_anggota.value.trim(), user = nomor.toLowerCase().replace(/ /g, '');
            if (K.one('anggota', function (a) { return a.nomor_anggota === nomor || a.username === user; })) { alert('Gagal! Nomor Anggota atau username otomatis sudah dipakai.'); return; }
            K.load().anggota.push({ id_anggota: K.nextId('anggota'), nomor_anggota: nomor, nama: f.nama.value, jenis_kelamin: f.jenis_kelamin.value, alamat: f.alamat.value,
                no_hp: f.no_hp.value, tanggal_daftar: K.today(), username: user, password: K.sha256('123456'), status: 'Aktif' });
            K.save(); f.reset(); render();
        });
        function bukaModalEdit(id) {
            var r = K.byId('anggota', 'id_anggota', id); if (!r) return;
            document.getElementById('edit_id').value = r.id_anggota;
            document.getElementById('edit_nomor').value = r.nomor_anggota || '';
            document.getElementById('edit_nama').value = r.nama;
            document.getElementById('edit_jk').value = r.jenis_kelamin;
            document.getElementById('edit_hp').value = r.no_hp || '';
            document.getElementById('edit_alamat').value = r.alamat || '';
            document.getElementById('edit_username').value = r.username;
            document.getElementById('edit_password').value = '';
            document.getElementById('modalEdit').classList.add('show');
        }
        function tutupModalEdit() { document.getElementById('modalEdit').classList.remove('show'); }
        function tutupModalBackdrop(e) { if (e.target.id === 'modalEdit') tutupModalEdit(); }
        document.getElementById('fEdit').addEventListener('submit', function (e) {
            e.preventDefault();
            var id = +document.getElementById('edit_id').value;
            var nomor = document.getElementById('edit_nomor').value.trim(), user = document.getElementById('edit_username').value.trim(), pass = document.getElementById('edit_password').value;
            if (K.one('anggota', function (a) { return a.nomor_anggota === nomor && a.id_anggota !== id; })) { alert('Gagal! Nomor Anggota ' + nomor + ' sudah digunakan anggota lain.'); return; }
            if (K.one('anggota', function (a) { return a.username === user && a.id_anggota !== id; })) { alert('Gagal! Username ' + user + ' sudah digunakan anggota lain.'); return; }
            var r = K.byId('anggota', 'id_anggota', id);
            r.nomor_anggota = nomor; r.nama = document.getElementById('edit_nama').value; r.jenis_kelamin = document.getElementById('edit_jk').value;
            r.alamat = document.getElementById('edit_alamat').value; r.no_hp = document.getElementById('edit_hp').value; r.username = user;
            if (pass) r.password = K.sha256(pass);
            K.save(); tutupModalEdit(); render();
        });
        render();
    </script>
</body>
</html>
