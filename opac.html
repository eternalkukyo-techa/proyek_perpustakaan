<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>OPAC - Koriko Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Quicksand', sans-serif; background: #F4F6F9; color: #333; }
        
        /* Hero Section */
        .hero { background: linear-gradient(135deg, #1E293B, #0F172A); color: white; padding: 60px 20px; text-align: center; border-bottom: 5px solid #D63344; }
        .hero h1 { font-size: 38px; margin-bottom: 10px; font-weight: 700; letter-spacing: 1px; }
        .hero p { font-size: 16px; opacity: 0.8; margin-bottom: 30px; }
        
        /* Search Box */
        .search-box { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 18px 25px; border-radius: 50px; border: none; font-size: 16px; font-family: 'Quicksand', sans-serif; box-shadow: 0 10px 20px rgba(0,0,0,0.2); outline: none; }
        .search-box select { padding: 0 25px; border-radius: 50px; border: none; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; background: white; outline: none; }

        /* Container & Grid */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid-buku { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        
        /* Book Card */
        .book-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; display: flex; flex-direction: column; border: 1px solid #E5E7EB; }
        .book-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        
        .cover-wrapper { width: 100%; height: 300px; background: #E5E7EB; position: relative; overflow: hidden; }
        .cover-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .book-card:hover .cover-wrapper img { transform: scale(1.05); }
        
        .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 16px; font-weight: 700; color: #1E293B; margin-bottom: 5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-author { font-size: 13px; color: #64748B; margin-bottom: 15px; }
        
        .btn-detail { margin-top: auto; display: block; text-align: center; background: #F1F5F9; color: #1E293B; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 14px; transition: 0.2s; border: 1px solid #E2E8F0; }
        .btn-detail:hover { background: #D63344; color: white; border-color: #D63344; }
        
        .login-link { text-align: center; margin-top: 40px; }
        .login-link a { color: #64748B; text-decoration: none; font-weight: 700; font-size: 14px; transition: 0.2s; }
        .login-link a:hover { color: #D63344; }
    </style>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="hero">
        <h1><i class="fas fa-book-open"></i> Koriko Public Catalog</h1>
        <p>Temukan koleksi buku favoritmu di perpustakaan kami.</p>
        <div class="search-box">
            <select id="filterKriteria">
                <option value="all">Semua</option>
                <option value="judul">Judul</option>
                <option value="pengarang">Pengarang</option>
                <option value="penerbit">Penerbit</option>
            </select>
            <input type="text" id="liveSearch" placeholder="Ketik kata kunci pencarian..." onkeyup="filterBooks()" autocomplete="off">
        </div>
    </div>

    <div class="container">
        <div class="grid-buku" id="bookGrid"></div>
        <div class="login-link">
            <a href="index.html"><i class="fas fa-lock"></i> Login Petugas / Pengguna</a>
        </div>
    </div>

    <script>
        var buku = K.load().bibliografi.slice().sort(function (a, b) { return b.id_buku - a.id_buku; });
        document.getElementById('bookGrid').innerHTML = buku.map(function (r) {
            var src = K.coverSrc(r) || K.placeholder(220, 300);
            return '<div class="book-card" data-judul="' + K.esc(String(r.judul).toLowerCase()) + '" data-pengarang="' + K.esc(String(r.pengarang).toLowerCase()) + '" data-penerbit="' + K.esc(String(r.penerbit || '').toLowerCase()) + '">' +
                '<div class="cover-wrapper"><img src="' + K.esc(src) + '" alt="Cover ' + K.esc(r.judul) + '" onerror="this.onerror=null;this.src=K.placeholder(220,300)"></div>' +
                '<div class="card-body"><div class="card-title">' + K.esc(r.judul) + '</div>' +
                '<div class="card-author"><i class="fas fa-pen"></i> ' + K.esc(r.pengarang) + '</div>' +
                '<a href="detail_buku.html?id=' + r.id_buku + '" class="btn-detail">Lihat Detail <i class="fas fa-arrow-right"></i></a></div></div>';
        }).join('');

        function filterBooks() {
            var input = document.getElementById("liveSearch").value.toLowerCase();
            var filter = document.getElementById("filterKriteria").value;
            var cards = document.getElementsByClassName("book-card");
            for (var i = 0; i < cards.length; i++) {
                var card = cards[i];
                var judul = card.getAttribute("data-judul"), pengarang = card.getAttribute("data-pengarang"), penerbit = card.getAttribute("data-penerbit");
                var match = false;
                if (filter === 'all') match = judul.includes(input) || pengarang.includes(input) || penerbit.includes(input);
                else if (filter === 'judul') match = judul.includes(input);
                else if (filter === 'pengarang') match = pengarang.includes(input);
                else if (filter === 'penerbit') match = penerbit.includes(input);
                card.style.display = match ? "flex" : "none";
            }
        }
        document.getElementById('filterKriteria').addEventListener('change', filterBooks);
    </script>
</body>
</html>
