<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sirkulasi - Koriko Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Quicksand', sans-serif; background-color: #F4F6F9; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #1A252F; color: white; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 25px 20px; font-weight: 700; font-size: 20px; color: #D63344; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-menu { list-style: none; padding: 15px 0; flex: 1; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 15px; padding: 15px 25px; color: #BDC3C7; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; border-left: 4px solid transparent; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: rgba(214,51,68,0.1); color: #D63344; border-left: 4px solid #D63344; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 30px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 25px; border: 1px solid #E5E7EB; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 13px; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #E5E7EB; border-radius: 10px; font-family: 'Quicksand', sans-serif; }
        .btn { background: #2C3E50; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; border: 1px solid #E5E7EB; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #E5E7EB; font-size: 13px; vertical-align: middle; }
        th { background: #F8F9FA; color: #555; font-weight: 700; font-size: 12px; }
        
        .badge-menunggu { background: #FFF3E0; color: #FB8C00; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; display: inline-block; }
        .badge-pinjam { background: #E3F2FD; color: #1E88E5; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; display: inline-block; }
        .badge-kembali { background: #E8F5E9; color: #43A047; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; display: inline-block; }
        .badge-ditolak { background: #FFEBEE; color: #E53935; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; display: inline-block; }
        .alasan-text { margin-top: 6px; font-size: 12px; color: #C62828; max-width: 240px; }
        
        .btn-acc { background: #43A047; color: white; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 12px; display:inline-block; margin-bottom:5px;}
        .btn-tolak { background: #E53935; color: white; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 12px; display:inline-block; border:none; cursor:pointer; font-family: 'Quicksand', sans-serif; }
        .btn-tepat { background: #43A047; color: white; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 12px; border:none; cursor:pointer; display:inline-block; margin-bottom:5px;}
        .btn-telat { background: #FB8C00; color: white; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 12px; border:none; cursor:pointer; }
        
        .alert { background: #FFE5E8; color: #D63344; padding: 15px; border-radius: 10px; font-weight: 700; margin-bottom: 20px; }

        /* Modal Tolak */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: white; width: 100%; max-width: 460px; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #E5E7EB; }
        .modal-close { background: none; border: none; font-size: 20px; color: #888; cursor: pointer; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
        .btn-batal { background: #E5E7EB; color: #374151; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        .btn-kirim-tolak { background: #E53935; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: 'Quicksand', sans-serif; }
    </style>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand"><i class="fas fa-book-open"></i> KorikoAdmin</div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dasbor Admin</a></li>
            <li><a href="bibliografi.html"><i class="fas fa-book"></i> Data Buku</a></li>
            <li><a href="keanggotaan.html"><i class="fas fa-users"></i> Keanggotaan</a></li>
            <li><a href="sirkulasi.html" class="active"><i class="fas fa-exchange-alt"></i> Sirkulasi</a></li>
            <li><a href="tambah_admin.html"><i class="fas fa-user-plus"></i> Tambah Admin</a></li>
            <li><a href="opac.html" target="_blank"><i class="fas fa-search"></i> Buka OPAC Publik</a></li>
            <li><a href="logout.html" style="margin-top: 50px; color: #FF8A80;"><i class="fas fa-sign-out-alt"></i> Keluar Sistem</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h2 style="margin-bottom: 25px; color: #2C3E50;">Sirkulasi Peminjaman</h2>
        <div id="pesan"></div>

        <div class="card">
            <h3 style="margin-bottom: 20px;">Catat Peminjaman Langsung (Tanpa ACC)</h3>
            <form id="fPinjam">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Pilih Anggota *</label>
                        <select name="id_anggota" id="selAnggota" required></select>
                    </div>
                    <div class="form-group">
                        <label>Pilih Buku *</label>
                        <select name="id_buku" id="selBuku" required></select>
                    </div>
                    <div class="form-group"><label>Tanggal Pinjam *</label><input type="date" name="tanggal_pinjam" id="tglPinjam" required></div>
                    <div class="form-group"><label>Lama Pinjam (Hari) *</label><input type="number" name="lama_pinjam" required min="1" max="30" value="7"></div>
                </div>
                <button type="submit" class="btn"><i class="fas fa-check"></i> Pinjamkan Sekarang</button>
            </form>
        </div>

        <table>
            <thead><tr><th>Peminjam</th><th>Buku</th><th>Tgl Pinjam</th><th>Status</th><th>Denda</th><th>Aksi</th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>

    <div id="modalTolak" class="modal-overlay" onclick="tutupBackdrop(event)">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fas fa-times-circle" style="color:#E53935;"></i> Tolak Pengajuan Buku</h3>
                <button type="button" class="modal-close" onclick="tutupModalTolak()">&times;</button>
            </div>
            <form id="fTolak">
                <input type="hidden" id="tolak_id">
                <p style="font-size:13px; color:#555; margin-bottom:14px;">
                    Buku: <strong id="tolak_judul"></strong><br>
                    Pemohon: <strong id="tolak_nama"></strong>
                </p>
                <div class="form-group">
                    <label>Alasan Penolakan *</label>
                    <textarea id="alasan_tolak" rows="3" required placeholder="Tulis alasan penolakan..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-batal" onclick="tutupModalTolak()">Batal</button>
                    <button type="submit" class="btn-kirim-tolak"><i class="fas fa-paper-plane"></i> Tolak &amp; Kirim Alasan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        K.requireRole('admin');
        function pesanGagal(m) { document.getElementById('pesan').innerHTML = '<div class="alert">' + K.esc(m) + '</div>'; }
        function render() {
            var db = K.load();
            var ang = db.anggota.slice().sort(function (a, b) { return K.cmpText(a.nama, b.nama); });
            document.getElementById('selAnggota').innerHTML = '<option value="">-- Pilih Peminjam --</option>' + ang.map(function (a) {
                return '<option value="' + a.id_anggota + '">' + K.esc((a.nomor_anggota || '') + ' - ' + a.nama) + '</option>'; }).join('');
            var bk = db.bibliografi.filter(function (b) { return b.stok > 0; }).sort(function (a, b) { return K.cmpText(a.judul, b.judul); });
            document.getElementById('selBuku').innerHTML = '<option value="">-- Pilih Koleksi Buku --</option>' + bk.map(function (b) {
                return '<option value="' + b.id_buku + '">' + K.esc(b.kode_buku + ' - ' + b.judul + ' (Stok: ' + b.stok + ')') + '</option>'; }).join('');
            if (!document.getElementById('tglPinjam').value) document.getElementById('tglPinjam').value = K.today();
            var data = db.sirkulasi.slice().sort(function (a, b) { return b.id_sirkulasi - a.id_sirkulasi; });
            document.getElementById('rows').innerHTML = data.map(function (r) {
                var a = K.byId('anggota', 'id_anggota', r.id_anggota), b = K.byId('bibliografi', 'id_buku', r.id_buku);
                if (!a || !b) return '';
                var st, aksi;
                if (r.status === 'Menunggu') st = '<span class="badge-menunggu">Menunggu ACC</span>';
                else if (r.status === 'Dipinjam') st = '<span class="badge-pinjam">Dipinjam</span>';
                else if (r.status === 'Ditolak') st = '<span class="badge-ditolak">Ditolak</span>' + (r.alasan_tolak ? '<div class="alasan-text"><b>Alasan:</b> ' + K.esc(r.alasan_tolak) + '</div>' : '');
                else st = '<span class="badge-kembali">Kembali</span>';
                if (r.status === 'Menunggu') aksi = '<a href="#" class="btn-acc" onclick="accPeminjaman(' + r.id_sirkulasi + ', \'Setujui peminjaman ini? Stok akan berkurang.\'); return false;"><i class="fas fa-check"></i> ACC</a> ' +
                    '<button type="button" class="btn-tolak" data-id="' + r.id_sirkulasi + '" data-judul="' + K.esc(b.judul) + '" data-nama="' + K.esc(a.nama) + '" onclick="bukaModalTolak(this)"><i class="fas fa-times"></i> Tolak</button>';
                else if (r.status === 'Dipinjam') aksi = '<button onclick="kembalikanTepat(' + r.id_sirkulasi + ')" class="btn-tepat"><i class="fas fa-check"></i> Tepat Waktu</button> ' +
                    '<button onclick="kembalikanTelat(' + r.id_sirkulasi + ')" class="btn-telat"><i class="fas fa-clock"></i> Terlambat</button>';
                else aksi = '<span style="color:#999;">Selesai</span>';
                return '<tr><td><strong>' + K.esc(a.nama) + '</strong></td><td>' + K.esc(b.judul) + '</td><td>' + K.esc(r.tanggal_pinjam) + '</td><td>' + st +
                    '</td><td><strong style="color:#D63344;">Rp ' + K.rp(r.denda) + '</strong></td><td>' + aksi + '</td></tr>';
            }).join('');
        }

        function bukaModalTolak(btn) {
            document.getElementById('tolak_id').value = btn.getAttribute('data-id');
            document.getElementById('tolak_judul').textContent = btn.getAttribute('data-judul');
            document.getElementById('tolak_nama').textContent = btn.getAttribute('data-nama');
            document.getElementById('alasan_tolak').value = '';
            document.getElementById('modalTolak').classList.add('show');
            document.getElementById('alasan_tolak').focus();
        }
        function tutupModalTolak() { document.getElementById('modalTolak').classList.remove('show'); }
        function tutupBackdrop(e) { if (e.target.id === 'modalTolak') tutupModalTolak(); }
        document.getElementById('fTolak').addEventListener('submit', function (e) {
            e.preventDefault();
            var id = +document.getElementById('tolak_id').value;
            var alasan = document.getElementById('alasan_tolak').value.trim() || 'Pengajuan peminjaman tidak dapat disetujui oleh pustakawan.';
            var t = K.byId('sirkulasi', 'id_sirkulasi', id);
            if (t && t.status === 'Menunggu') { t.status = 'Ditolak'; t.alasan_tolak = alasan; K.save(); }
            tutupModalTolak(); render();
        });
        function accPeminjaman(id, konfirmasi) {
            if (!confirm(konfirmasi)) return;
            var t = K.byId('sirkulasi', 'id_sirkulasi', id);
            if (t && t.status === 'Menunggu') {
                var b = K.byId('bibliografi', 'id_buku', t.id_buku);
                if (b && b.stok > 0) { t.status = 'Dipinjam'; t.alasan_tolak = null; b.stok -= 1; K.save(); }
                else if (typeof pesanGagal === 'function') pesanGagal('Gagal ACC! Stok buku ini keburu habis.');
            }
            render();
        }

        document.getElementById('fPinjam').addEventListener('submit', function (e) {
            e.preventDefault();
            var f = e.target, ida = +f.id_anggota.value, idb = +f.id_buku.value, tgl = f.tanggal_pinjam.value, lama = parseInt(f.lama_pinjam.value, 10);
            var b = K.byId('bibliografi', 'id_buku', idb);
            if (b && b.stok > 0) {
                K.load().sirkulasi.push({ id_sirkulasi: K.nextId('sirkulasi'), id_anggota: ida, id_buku: idb, tanggal_pinjam: tgl, tanggal_kembali_seharusnya: K.addDays(tgl, lama), tanggal_dikembalikan: null, status: 'Dipinjam', denda: 0, alasan_tolak: null });
                b.stok -= 1; K.save();
                document.getElementById('pesan').innerHTML = ''; f.reset(); document.getElementById('tglPinjam').value = K.today(); f.lama_pinjam.value = 7;
            } else pesanGagal('Stok buku habis!');
            render();
        });
        function kembalikan(id, denda) {
            var t = K.byId('sirkulasi', 'id_sirkulasi', id);
            if (t && t.status === 'Dipinjam') {
                t.tanggal_dikembalikan = K.today(); t.status = 'Kembali'; t.denda = denda;
                var b = K.byId('bibliografi', 'id_buku', t.id_buku); if (b) b.stok += 1;
                K.save();
            }
            render();
        }
        function kembalikanTepat(id) { if (confirm('Proses pengembalian buku tepat waktu? (Denda Rp 0)')) kembalikan(id, 0); }
        function kembalikanTelat(id) {
            var nominal = prompt("Buku terlambat! Masukkan nominal denda (hanya angka, contoh: 5000):", "5000");
            if (nominal != null && nominal !== "" && !isNaN(nominal)) kembalikan(id, parseInt(nominal, 10));
        }
        render();
    </script>
</body>
</html>
